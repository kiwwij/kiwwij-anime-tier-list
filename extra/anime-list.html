<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои списки аниме</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <link rel="icon" type="image/x-icon" href="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXE3bTQ5eGphYThrNTYwZDNkbXNucWMyYnljeG14NjRvejZzZTB6bCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/OpYV9CBVZOb1S/giphy.gif" />

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2a374a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            
            --score-masterpiece: #facc15; 
            --score-good: #22c55e;        
            --score-mid: #3b82f6;         
            --score-bad: #ef4444;         
        }

        body.light-theme {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-card-hover: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --accent: #4f46e5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .top-wrapper {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
            margin-bottom: 25px;
        }

        .switch { 
            position: absolute; 
            right: 10px; 
            top: 0;
            width: 3.5em; 
            height: 2em; 
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; 
            cursor: pointer; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background-color: #f4f4f5;
            transition: .4s; 
            border-radius: 30px; 
        }
        .slider:before { 
            position: absolute; 
            content: ""; 
            height: 1.4em; width: 1.4em; 
            border-radius: 50%; 
            left: 0.3em; top: 50%; 
            transform: translateY(-50%); 
            background: linear-gradient(40deg, #ff0080, #ff8c00 70%); 
            transition: .4s; 
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5); 
        }
        input:checked + .slider { background-color: #303136; }
        input:checked + .slider:before { 
            left: calc(100% - 1.7em);
            background: transparent; 
            box-shadow: inset -5px -2px 0px 0px #ffffff, inset -6px -2px 0px 0px #a3dafb; 
        }

        .header h2 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
        }

        .header a {
            color: var(--accent);
            text-decoration: none;
        }

        .search-container {
            position: relative;
            max-width: 400px;
            margin: 15px auto 30px auto;
        }
        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 35px 10px 15px;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input:focus { border-color: var(--accent); }
        .clear-search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            display: none;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .list-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.1);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        body.light-theme .list-column {
            background: rgba(0, 0, 0, 0.02);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .column-header h3 {
            margin: 0;
            font-size: 1.15rem;
        }

        .stats-summary {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .anime-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s ease;
            margin-bottom: 6px;
        }

        .anime-card:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }

        .anime-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 10px;
        }

        .anime-title {
            font-weight: 600;
            font-size: 0.85rem;
            line-height: 1.3;
        }

        .fav-icon {
            color: #ef4444;
            font-size: 1.1rem;
        }

        .anime-score {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        body.light-theme .anime-score {
            background: rgba(0, 0, 0, 0.05);
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: var(--accent);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px) scale(0.95); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="top-wrapper">
        <label class="switch" title="Сменить тему">
            <input type="checkbox" id="themeToggle" />
            <span class="slider"></span>
        </label>
        
        <div class="header">
            <h2>Все списки аниме</h2>
            <p>Источник: <a href="https://site.yummyani.me/" target="_blank">site.yummyani.me</a></p>
            <p>Загружено: 5 августа 2026 г.</p>
        </div>

        <div class="search-container">
            <input type="text" id="animeSearch" class="search-input" placeholder="Найти аниме по названию..." autocomplete="off">
            <button id="clearSearch" class="clear-search-btn" title="Очистить">&times;</button>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <!-- тут все аниме -->
    </div>

    <div id="toast-container"></div>

<script>
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';

    if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        themeToggle.checked = false; 
    } else {
        document.body.classList.remove('light-theme');
        themeToggle.checked = true;
    }

    themeToggle.addEventListener('change', () => {
        if (themeToggle.checked) {
            document.body.classList.remove('light-theme');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.add('light-theme');
            localStorage.setItem('theme', 'light');
        }
    });

    const columnsConfig = {
        watching: { title: "Смотрю", order: 1 },
        planned: { title: "В Планах", order: 2 },
        completed: { title: "Просмотрено", order: 3 },
        dropped: { title: "Брошено", order: 4 },
        favorites: { title: "Любимые", order: 5 }
    };

    function getScoreColor(score) {
        if (score === 0) return 'var(--text-muted)';
        if (score >= 9) return 'var(--score-masterpiece)';
        if (score >= 7) return 'var(--score-good)';
        if (score >= 5) return 'var(--score-mid)';
        return 'var(--score-bad)';
    }

    function showToast(message) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class='bx bx-check-circle'></i> ${message}`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.3s ease forwards';
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }

    function renderDashboard(data) {
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = ''; 
        
        const grouped = { watching: [], planned: [], completed: [], dropped: [], favorites: [] };
        
        data.forEach(item => {
            if (grouped[item.status]) {
                grouped[item.status].push(item);
            }
            if (item.is_fav) {
                grouped.favorites.push({...item}); 
            }
        });

        const sortedKeys = Object.keys(grouped).sort((a, b) => columnsConfig[a].order - columnsConfig[b].order);

        const fragment = document.createDocumentFragment();

        sortedKeys.forEach(statusKey => {
            const items = grouped[statusKey];
            if (items.length === 0) return;

            items.sort((a, b) => a.target_title.localeCompare(b.target_title, 'ru', { numeric: true }));

            const ratedItems = items.filter(i => i.score > 0);
            const avgScore = ratedItems.length > 0 
                ? (ratedItems.reduce((sum, i) => sum + i.score, 0) / ratedItems.length).toFixed(2) 
                : 0;

            const colDiv = document.createElement('div');
            colDiv.className = 'list-column';

            colDiv.innerHTML = `
                <div class="column-header">
                    <h3>${columnsConfig[statusKey].title}</h3>
                    <span class="stats-summary" id="stats-${statusKey}">
                        ${items.length} шт ${avgScore > 0 ? `| ${avgScore}⭐` : ''}
                    </span>
                </div>
            `;

            const cardsContainer = document.createElement('div');
            cardsContainer.className = 'cards-container';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.dataset.title = item.target_title.toLowerCase();

                card.onclick = () => {
                    navigator.clipboard.writeText(item.target_title).then(() => {
                        showToast('Скопировано');
                    });
                };

                const favIcon = item.is_fav ? `<i class='bx bxs-heart fav-icon'></i>` : '';
                const scoreHtml = item.score > 0 
                    ? `<span class="anime-score" style="color: ${getScoreColor(item.score)}">${item.score}⭐</span>` 
                    : '';

                card.innerHTML = `
                    <div class="anime-info">
                        ${favIcon}
                        <span class="anime-title">${item.target_title}</span>
                    </div>
                    ${scoreHtml}
                `;
                cardsContainer.appendChild(card);
            });

            colDiv.appendChild(cardsContainer);
            fragment.appendChild(colDiv);
        });

        dashboard.appendChild(fragment);
    }

    const searchInput = document.getElementById('animeSearch');
    const clearBtn = document.getElementById('clearSearch');

    function filterCards() {
        const query = searchInput.value.toLowerCase().trim();
        const columns = document.querySelectorAll('.list-column');
        
        clearBtn.style.display = query.length > 0 ? 'block' : 'none';

        columns.forEach(col => {
            const cards = col.querySelectorAll('.anime-card');
            let visibleCount = 0;
            let sumScore = 0;
            let ratedCount = 0;

            cards.forEach(card => {
                if (card.dataset.title.includes(query)) {
                    card.style.display = 'flex';
                    visibleCount++;
                    
                    const scoreSpan = card.querySelector('.anime-score');
                    if (scoreSpan) {
                        const score = parseFloat(scoreSpan.textContent);
                        if (!isNaN(score) && score > 0) {
                            sumScore += score;
                            ratedCount++;
                        }
                    }
                } else {
                    card.style.display = 'none';
                }
            });

            const statsSpan = col.querySelector('.stats-summary');
            if (statsSpan) {
                const avgScore = ratedCount > 0 ? (sumScore / ratedCount).toFixed(2) : 0;
                statsSpan.textContent = `${visibleCount} шт ${avgScore > 0 ? '| ' + avgScore + '⭐' : ''}`;
            }

            col.style.display = visibleCount > 0 ? 'flex' : 'none';
        });
    }

    searchInput.addEventListener('input', filterCards);
    
    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        filterCards();
        searchInput.focus();
    });

    document.addEventListener('DOMContentLoaded', () => {

        fetch('../data/anime-list.json')
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сети');
                return response.json();
            })
            .then(data => {
                renderDashboard(data);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('dashboard').innerHTML = 
                    '<p style="text-align:center; grid-column: 1/-1; color: var(--score-bad);">Ошибка! Убедитесь, что JSON загружен по пути ../data/anime-list.json</p>';
            });
    });
</script>
</body>
</html>

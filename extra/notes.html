<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки | kiwwij</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/originals/1e/28/50/1e28507cdc5bfc16e9b2c575501216b4.gif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/notes.css">
</head>

<body class="tierlist-page">

    <header>
        <div class="header-content">
            <div class="top-row">
                <h1 class="logo-text">Заметки</h1>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <nav class="nav-links">
                <a href="../pages/about-me.html" class="btn-link"><i class='bx bx-user'></i> Обо мне</a>
                <a href="../index.html" class="btn-link"><i class='bx bx-home-alt'></i> На главную</a>
            </nav>
        </div>
    </header>

    <main class="stats-container">
        <div id="notesContainer" class="notes-list"></div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">kiwwij</span>
                <p class="footer-copyright">© <span id="current-year"></span>. No Copyright.</p>
            </div>

            <nav class="footer-nav-center">
                <a href="../pages/navigation.html" class="social-link" title="Навигация">
                    <i class='bx bx-map-alt'></i>
                </a>
            </nav>

            <nav class="footer-socials">
                <a href="https://github.com/kiwwij" class="social-link" target="_blank"><i class='bx bxl-github'></i></a>
                <a href="https://kiwwij.github.io/my-projects/html/kiwwij's-social-media-links.html" class="social-link" target="_blank"><i class='bx bx-link-alt'></i></a>
            </nav>
        </div>
    </footer>

    <script src="../data/notes-data.js"></script>
    <script src="../js/notes.js"></script>
    <script src="../js/holidays.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const btn = document.getElementById("scrollTopBtn");

            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                themeToggle.checked = false;
            } else {
                themeToggle.checked = true;
            }

            themeToggle.addEventListener('change', () => {
                if (themeToggle.checked) {
                    body.classList.remove('light-theme');
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.add('light-theme');
                    localStorage.setItem('theme', 'light');
                }
            });
        });
    </script>

    <button class="notes-nav-toggle" id="notesNavToggle" title="Архив заметок">
        ☰
    </button>

    <nav class="notes-nav" id="notesNav">
        <div class="notes-nav-title">Архив</div>
        <div id="notesNavLinks"></div>
    </nav>

    <script>
        const yearElement = document.getElementById('current-year');
            if (yearElement) {
                yearElement.textContent = new Date().getFullYear();
            }
    </script>
</body>
</html>

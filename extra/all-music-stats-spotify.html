<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Stats | kiwwij</title>
    <link rel="icon" type="image/x-icon" href="https://i.gifer.com/ICU.gif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/all-music-stats-spotify.css">
</head>
<body class="tierlist-page">
    <header>
        <div class="header-content">
            <div class="top-row">
                <h1 class="logo-text">Spotify <span>Статистика</span></h1>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <nav class="nav-links">
                <a href="../pages/music.html" class="btn-link"><i class='bx bx-play-circle'></i> Основной плейлист</a>
                <a href="all-music.html" class="btn-link"><i class='bx bxs-playlist'></i> Все плейлисты</a>
                <a href="../index.html" class="btn-link"><i class='bx bx-home-alt'></i> На главную</a>
            </nav>
        </div>
    </header>

    <main class="stats-container">
        <div class="now-playing-card glass-panel" id="nowPlayingCard">
            <div class="np-info">
                <i class='bx bx-loader-alt bx-spin' id="npIcon"></i>
                <div class="np-text">
                    <span class="np-status" id="npStatus">Загрузка...</span>
                    <span class="np-track" id="npTrack">-</span>
                    <span class="np-artist" id="npArtist">-</span>
                </div>
            </div>
            <img src="" alt="Обложка" class="np-cover" id="npCover" style="display: none;">
        </div>

        <div class="stats-summary">
            <div class="stat-card spotify-card">
                <h3>Всего прослушиваний</h3>
                <span class="stat-number" id="totalScrobbles">0</span>
            </div>
            <div class="stat-card spotify-card">
                <h3>Любимый артист (за месяц)</h3>
                <span class="stat-number artist-name" id="topArtist">-</span>
            </div>
            <div class="stat-card spotify-card">
                <h3>Любимый трек (за месяц)</h3>
                <span class="stat-number" id="topTrack">-</span>
            </div>
        </div>

        <div class="music-main-grid">
            <div class="glass-panel chart-panel">
                <h2 class="panel-title">Топ-10 исполнителей за месяц</h2>
                <div class="chart-wrapper">
                    <canvas id="artistsChart"></canvas>
                </div>
            </div>

            <div class="glass-panel list-panel">
                <h2 class="panel-title">Недавние треки</h2>
                <div class="scrollable-list">
                    <ul id="recentTracksList" class="music-list-detailed"></ul>
                </div>
            </div>
        </div>

        <div class="glass-panel playlists-panel">
            <h2 class="panel-title">Мои плейлисты</h2>
            <div class="spotify-widgets-grid">
                <iframe src="https://open.spotify.com/embed/playlist/2LuLabhw1ePiZ9hPOOn74R?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

                <iframe src="https://open.spotify.com/embed/playlist/3X7fLv0k01XSUysMNBDHHv?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                
                <iframe src="https://open.spotify.com/embed/playlist/3RWY8WZmowKkdjKx9MIqiS?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

                <iframe src="https://open.spotify.com/embed/playlist/3qRnwj5j7fKNFujBc3JHCG?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

                <iframe src="https://open.spotify.com/embed/playlist/2HMkRtiV377FReLMDXaX30?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">kiwwij</span>
                <p class="footer-copyright">© <span id="current-year"></span>. No Copyright.</p>
            </div>
        </div>
    </footer>

    <script src="../js/all-music-stats-spotify.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const savedTheme = localStorage.getItem('theme') || 'dark';

            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                themeToggle.checked = false;
            } else {
                themeToggle.checked = true;
            }

            themeToggle.addEventListener('change', () => {
                if (themeToggle.checked) {
                    body.classList.remove('light-theme');
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.add('light-theme');
                    localStorage.setItem('theme', 'light');
                }
            });
            document.getElementById('current-year').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Посмертное возвращение</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            /* Темный градиент в стиле теней Сателлы */
            background: radial-gradient(circle, #1a1a2e 0%, #000000 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .error-page {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: fadeIn 2s ease-in;
        }

        /* Эффект глитча для 404 */
        .error-code {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            position: relative;
            margin-bottom: -20px;
        }

        .error-img {
            max-width: 400px;
            width: 90%;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(145, 70, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            filter: grayscale(0.3) contrast(1.1);
        }

        h2 {
            font-family: 'Inter', sans-serif;
            color: #fff;
            margin-top: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .error-quote {
            color: #94a3b8;
            font-style: italic;
            margin: 15px auto;
            max-width: 600px;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        /* Кнопка в стиле "Return by Death" */
        .btn-return {
            margin-top: 30px;
            padding: 12px 30px;
            background: transparent;
            border: 2px solid #ff0055;
            color: #ff0055;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-return:hover {
            background: #ff0055;
            color: #000;
            box-shadow: 0 0 20px #ff0055;
        }

        /* Фон с дымом или частицами */
        .shadow-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.3;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="shadow-bg"></div>

    <main class="error-page">
        <div class="error-code">404</div>

        <h2>Ты попал в Сад Чаепития</h2>
        
        <p class="error-quote">
            «Сколько бы раз тебе ни приходилось начинать всё сначала... <br> 
            этой страницы здесь никогда не было».
        </p>

        <p style="color: #6366f1; font-weight: bold; margin-bottom: 20px;">
            Твой путь прервался, НН-кун.
        </p>

        <a href="https://kiwwij.github.io/kiwwij-anime-tier-list/index.html" class="btn btn-link btn-return">Попробовать снова?</a>
    </main>
</body>
</html>

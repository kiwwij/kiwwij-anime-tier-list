name: Update Music Data

on:
  schedule:
    - cron: '0 0 * * *' # Запуск каждый день в 00:00 UTC
  workflow_dispatch: # Кнопка ручного запуска в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        # Устанавливаем библиотеки из requirements.txt (там должен быть ytmusicapi)
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Single Playlist scraper
        # Обновляет только основной плейлист (music_data.js)
        run: python scripts/update_music.py

      - name: Run All Playlists scraper
        # Обновляет страницу с 4 плейлистами (all_music_data.js)
        run: python scripts/update_all_music.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          # Добавляем оба сгенерированных файла
          git add data/music-data.js data/all-music-data.js
          
          # Если изменений нет (плейлисты не поменялись), exit 0 предотвратит ошибку пайплайна
          git commit -m "Auto-update music playlists" || exit 0
          
          git push

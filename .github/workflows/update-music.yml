name: Update Music Data

on:
  schedule:
    # update_music.py — каждый час
    - cron: "0 * * * *"

    # update_all_music.py — каждый час + 10 минут
    - cron: "10 * * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      # Запускаем оба скрипта, но только один из них будет выполняться
      # (в зависимости от того, какой cron-триггер сработал)
      - name: Run scrapers
        run: |
          echo "Triggered at $(date -u)"
          
          if [ "$(date -u +%M)" = "00" ]; then
            echo "Running: update_music.py"
            python scripts/update_music.py
          fi
          
          if [ "$(date -u +%M)" = "10" ]; then
            echo "Running: update_all_music.py"
            python scripts/update_all_music.py
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          git add data/music-data.js data/all-music-data.js

          git commit -m "Auto-update music playlists" || exit 0
          git push
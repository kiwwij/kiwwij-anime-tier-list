name: Update Music Data

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install ytmusicapi

      - name: Run scrapers
        run: |
          CURRENT_MINUTE=$(date -u +%1M) 

          echo "Triggered at $(date -u). Current minute: $CURRENT_MINUTE"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger: Running BOTH scripts"
            python scripts/update_music.py
            python scripts/update_all_music.py

          elif [ "$CURRENT_MINUTE" -lt 9 ]; then
            echo "Schedule match (approx 00): Running update_music.py"
            python scripts/update_music.py
            
          else
            echo "Schedule match (approx 10): Running update_all_music.py"
            python scripts/update_all_music.py
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          git add data/*.js

          git commit -m "Auto-update music playlists" || echo "No changes to commit"

          git push

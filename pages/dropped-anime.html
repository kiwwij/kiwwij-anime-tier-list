<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Брошенные Аниме</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/originals/d7/c8/ca/d7c8ca2a34d64b75c834c10b1776cc7f.gif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/tierlist-styles.css">
</head>
<body class="tierlist-page">

    <header>
        <div class="header-content">
            <div class="top-row">
                <h1 class="logo-text">Брошенные тайтлы</h1>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <nav class="nav-links">
                <a href="../extra/stats-drop.html" class="btn-link"><i class='bx bx-bar-chart-alt-2'></i> Статистика</a>
                <a href="../index.html" class="btn-link"><i class='bx bx-home-alt'></i> На главную</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="dropped-header">
            <p>Аниме, которые не смогли меня удержать или стали скучными в процессе просмотра</p>
            <p>(могут быть проблемы с постерами)</p>
        </div>

        <div id="droppedListContainer" class="dropped-grid"></div>
    </main>

    <dialog id="detailsModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">
                <i class='bx bx-x'></i>
            </button>
            <div class="modal-header">
                <img src="" alt="" class="modal-img" id="modalImg">
            </div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p id="modalAltTitle" class="modal-subtitle"></p>
                <div id="modalRating" class="modal-meta"></div>
                <div class="modal-review-box">
                    <h3>Почему дропнул:</h3> <p id="modalReview"></p>
                </div>
            </div>
        </div>
    </dialog>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">kiwwij</span>
                <p class="footer-copyright">© <span id="current-year"></span>. No Copyright.</p>
            </div>

            <nav class="footer-nav-center">
                <a href="navigation.html" class="social-link" title="Навигация">
                    <i class='bx bx-map-alt'></i>
                </a>
            </nav>

            <nav class="footer-socials">
                <a href="https://github.com/kiwwij" class="social-link" target="_blank"><i class='bx bxl-github'></i></a>
                <a href="https://kiwwij.github.io/kiwwij-social-links/" class="social-link" target="_blank"><i class='bx bx-link-alt'></i></a>
            </nav>
        </div>
    </footer>

    <script src="../data/dropped-anime-data.js" defer></script> 
    <script src="../js/dropped-anime.js" defer></script>
    <script src="../js/holidays.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const btn = document.getElementById("scrollTopBtn");

            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                themeToggle.checked = false;
            } else {
                themeToggle.checked = true;
            }

            themeToggle.addEventListener('change', () => {
                if (themeToggle.checked) {
                    body.classList.remove('light-theme');
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.add('light-theme');
                    localStorage.setItem('theme', 'light');
                }
            });
        });
    </script>
    <script>
        const yearElement = document.getElementById('current-year');
            if (yearElement) {
                yearElement.textContent = new Date().getFullYear();
            }
    </script>
</body>
</html>

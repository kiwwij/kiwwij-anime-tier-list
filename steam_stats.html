<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Steam Профиль</title>
    <meta name="description" content="Моя игровая статистика Steam, библиотека и недавние игры.">
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/originals/be/73/3e/be733ee15fd11eabeb5dfa107f32f11e.gif">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Игровая статистика</h1>
        <div class="controls">
            <a href="index.html" class="btn btn-link">Назад к Тир-Листам</a>
        </div>
    </header>

    <main class="stats-container">
        
        <!-- 1. Профиль -->
        <div class="steam-header">
            <div class="avatar-frame">
                <img src="https://via.placeholder.com/150" alt="Avatar" id="steamAvatar">
            </div>
            <div class="profile-info">
                <h2 id="steamNick">Загрузка...</h2>
                <a href="#" target="_blank" id="steamLink" class="profile-link">Открыть профиль Steam ↗</a>
                <div id="statusContainer">
                    <span id="steamStatus" class="status-badge">...</span>
                </div>
            </div>
        </div>

        <!-- 2. Недавно играл -->
        <div class="chart-section" id="recentSection" style="display: none;">
            <h2 style="color: #fff; border-left: 4px solid #66c0f4; padding-left: 10px;">Недавно запускал</h2>
            <div class="games-grid" id="recentGames"></div>
        </div>

        <!-- 3. Топ по времени -->
        <div class="chart-section">
            <div style="margin-bottom: 1rem;">
                <h2 style="color: #fff; border-left: 4px solid #a5b4fc; padding-left: 10px; display: inline-block;">Топ 20 игр по времени</h2>
                <span style="color: rgba(156, 163, 175, 0.4); font-size: 11px; font-weight: 400; margin-top: 4px; letter-spacing: 0.02em;"><br>(из-за того что Valve контора пи... Dota 2 не отображается, как и вишлист)</span>
            </div>
            <div class="games-grid" id="topGames"></div>
        </div>

        <!-- 4. Общая статистика (Вместо вишлиста) -->
        <!-- <div class="total-stats-card">
            <h2 style="color: #fff; margin-bottom: 1rem;">Всего на аккаунте</h2>
            <div class="total-stats-grid">
                <div class="total-stat-item">
                    <span id="totalGamesCount">0</span>
                    <p>Игр</p>
                </div>
            </div>
        </div> -->

    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">kiwwij</span>
                <p class="footer-copyright">© 2025. No Copyright.</p>
            </div>
            <div class="footer-socials">
                <a href="https://kiwwij.github.io/kiwwij-social-links/" target="_blank" aria-label="Social Media Links" class="social-link">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.354 5.5H4a3 3 0 0 0 0 6h3a3 3 0 0 0 2.83-4H9c-.086 0-.17.01-.25.031A2 2 0 0 1 7 10.5H4a2 2 0 1 1 0-4h1.535c.218-.376.495-.71.82-1z"/>
                        <path d="M9 5.5a3 3 0 0 0-2.83 4h1.098A2 2 0 0 1 9 6.5h3a2 2 0 1 1 0 4h-1.535a4.02 4.02 0 0 1-.82 1H12a3 3 0 1 0 0-6H9z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script src="data/steam-profile-data.js"></script>

    <script src="js/steam.js"></script>
    <script src="js/holidays.js"></script>
</body>
</html>

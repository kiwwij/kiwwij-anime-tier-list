<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Аниме Тир-Лист</title>
    <meta author="kiwwij">
    <meta name="description" content="Все мои аниме, собранные в тир-листе с коротким описанием.">
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/originals/53/a0/3d/53a03dfe10d137fe7427b48471e2c5aa.gif">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8 flex flex-col">

    <div class="max-w-7xl mx-auto w-full flex-grow">
        
        <!-- Заголовок -->
        <h1 class="text-3xl md:text-5xl font-bold text-center my-8 text-indigo-400">
            Мой Аниме Тир-Лист
        </h1>

        <!-- Панель управления -->
        <div class="flex flex-col md:flex-row justify-center items-center gap-6 mb-8 p-4 bg-gray-800 rounded-lg shadow-xl">
            <!-- Выбор года -->
            <div>
                <label for="year-select" class="block text-sm font-medium text-gray-300 mb-2">Год просмотра:</label>
                <select id="year-select" class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </select>
            </div>
            <!-- Выбор шкалы -->
            <div>
                <label for="scale-select" class="block text-sm font-medium text-gray-300 mb-2">Шкала рейтинга:</label>
                <select id="scale-select" class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="standard">Стандартная (S-F)</option>
                    <option value="personal">Личная</option>
                </select>
            </div>
             <!-- Ссылка на статистику -->
            <div>
                <!-- Пустой label для выравнивания по высоте с другими селектами на MD экранах -->
                <label class="block text-sm font-medium text-gray-300 mb-2 opacity-0 hidden md:block">Статистика:</label>
                <a href="stats.html" class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 rounded-lg px-4 py-2 text-white font-medium transition-colors">
                    Смотреть статистику
                </a>
            </div>
        </div>

        <!-- Индикатор загрузки -->
        <div id="loading-indicator" class="text-center text-lg text-indigo-300 py-10 hidden">
            <svg class="animate-spin h-8 w-8 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            Загрузка постеров...
        </div>

        <!-- Контейнер для тир-листа -->
        <div id="tier-list-container" class="space-y-2">
            <!-- Тиры будут генерироваться здесь -->
        </div>

    </div>

    <!-- Футер -->
    <footer class="w-full mt-12 py-6 border-t border-gray-700">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-4 gap-4">
            <!-- Ник и копирайт -->
            <div class="text-center md:text-left">
                <span class="text-lg font-bold text-indigo-400">kiwwij</span>
                <p class="text-sm text-gray-400">© 2025. No Copyright.</p>
            </div>
            <!-- Иконки соцсетей (пример) -->
            <div class="flex gap-4">
                <a href="https://kiwwij.github.io/kiwwij-social-links/" target="_blank" aria-label="Social Media Links" class="text-gray-400 hover:text-indigo-400 transition-colors">
                    <!-- ВОТ НОВАЯ ИКОНКА GITHUB -->
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.354 5.5H4a3 3 0 0 0 0 6h3a3 3 0 0 0 2.83-4H9c-.086 0-.17.01-.25.031A2 2 0 0 1 7 10.5H4a2 2 0 1 1 0-4h1.535c.218-.376.495-.71.82-1z"/>
                        <path d="M9 5.5a3 3 0 0 0-2.83 4h1.098A2 2 0 0 1 9 6.5h3a2 2 0 1 1 0 4h-1.535a4.02 4.02 0 0 1-.82 1H12a3 3 0 1 0 0-6H9z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>


    <!-- Модальное окно для отзыва -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
        <!-- Кнопка закрытия (на оверлее) -->
        <div id="modal-overlay-close" class="absolute inset-0"></div>
        
        <!-- Контент модального окна -->
        <div class="bg-gray-800 rounded-2xl shadow-2xl max-w-2xl w-full flex flex-col md:flex-row gap-6 p-6 relative z-10">
            <!-- Кнопка закрытия 'X' -->
            <button id="modal-close" class="absolute -top-3 -right-3 text-white bg-indigo-600 rounded-full w-8 h-8 flex items-center justify-center text-xl font-bold hover:bg-indigo-700 transition-colors">&times;</button>
            
            <!-- Постер -->
            <img id="modal-poster" src="https://placehold.co/300x420/333/666?text=Anime" alt="Постер аниме" class="w-full md:w-1/3 h-auto object-cover rounded-lg shadow-lg aspect-[3/4]">
            
            <!-- Информация -->
            <div class="flex flex-col gap-4 w-full md:w-2/3">
                <h2 id="modal-title" class="text-3xl font-bold text-indigo-300">Название Аниме</h2>
                <!-- Русское название (будет скрыто, если его нет) -->
                <h3 id="modal-russian-title" class="text-xl font-medium text-gray-300 -mt-3"></h3>
                
                <!-- Рейтинг (будет скрыт, если его нет) -->
                <div id="modal-rating-container" class="flex items-center gap-2">
                    <span class="text-yellow-400">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    </span>
                    <span id="modal-rating" class="text-lg font-medium text-gray-200"></span>
                </div>
                
                <!-- Отзыв -->
                <div>
                    <span class="text-sm font-bold text-gray-400 tracking-wider uppercase">Мой комментарий:</span>
                    <p id="modal-review" class="text-lg text-gray-200 mt-1">
                        Здесь будет мой краткий отзыв на 2-3 предложения.
                    </p>
                </div>
            </div>
        </div>
    </div>


    <!-- Подключаем данные и скрипт -->
    <script src="anime-data.js"></script>
    <script src="script.js"></script>
</body>
</html>

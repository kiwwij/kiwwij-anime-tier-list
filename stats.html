<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика по моим аниме</title>
    <meta author="kiwwij">
    <meta name="description" content="Статистика по моим аниме, включая жанры, рейтинги и просмотры.">
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/originals/00/82/0f/00820fe9b5e5ee5e6deece92054603b3.gif">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Статистика просмотренных аниме</h1>
        <div class="controls">
            <a href="index.html" class="btn btn-link">Назад к Тир-Листам</a>
        </div>
    </header>

    <main class="stats-container">
        <div class="stats-summary">
            <div class="stat-card">
                <h3>Всего аниме</h3>
                <span class="stat-number" id="totalCount">0</span>
                <small class="text-muted">Без дубликатов</small>
            </div>
            <div class="stat-card">
                <h3>Обработано тайтлов</h3>
                <span class="stat-number" id="processedCount">0</span>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <p>Анализ жанров через Kitsu API <span id="loadingPercent">0%</span></p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <small class="text-muted">Это займет время, чтобы избежать блокировки API.</small>
        </div>

        <div class="chart-section">
            <h2>Топ-15 Жанров</h2>
            <div class="chart-wrapper">
                <canvas id="genresChart"></canvas>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">kiwwij</span>
                <p class="footer-copyright">© 2025. No Copyright.</p>
            </div>
            
            <div class="footer-socials">
                <a href="https://kiwwij.github.io/kiwwij-social-links/" target="_blank" aria-label="Social Media Links" class="social-link">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.354 5.5H4a3 3 0 0 0 0 6h3a3 3 0 0 0 2.83-4H9c-.086 0-.17.01-.25.031A2 2 0 0 1 7 10.5H4a2 2 0 1 1 0-4h1.535c.218-.376.495-.71.82-1z"/>
                        <path d="M9 5.5a3 3 0 0 0-2.83 4h1.098A2 2 0 0 1 9 6.5h3a2 2 0 1 1 0 4h-1.535a4.02 4.02 0 0 1-.82 1H12a3 3 0 1 0 0-6H9z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script src="data/anime-data.js"></script>
    <script src="data/rezero-data.js"></script>
    <script src="data/energydrink-data.js"></script>

    <script src="js/stats.js"></script>
    <script src="js/holidays.js"></script>
</body>
</html>
